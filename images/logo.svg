<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Reuman Lab">
  <!-- Wordmark: "Reum" + ladybug (substituting 'a') + "n L" + Greek alpha (outlined) + "b" -->
  <text x="0" y="36"
        font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif"
        font-size="34" font-weight="600" fill="currentColor">Reum<tspan dx="24">n L</tspan><tspan dy="-1" font-size="30" fill="white" stroke="currentColor" stroke-width="2.5" paint-order="stroke fill">α</tspan><tspan dy="1">b</tspan></text>

  <!-- Ladybug substituting the 'a' in "Reuman" -->
  <g transform="translate(106.5, 27) scale(0.85)" stroke="currentColor" stroke-linecap="round" fill="none">
    <!-- Legs drawn first so they sit behind the body -->
    <line x1="-8" y1="-4" x2="-13" y2="-7" stroke-width="1.3"/>
    <line x1="-9" y1="1"  x2="-14" y2="2"  stroke-width="1.3"/>
    <line x1="-8" y1="6"  x2="-12" y2="9"  stroke-width="1.3"/>
    <line x1="8"  y1="-4" x2="13"  y2="-7" stroke-width="1.3"/>
    <line x1="9"  y1="1"  x2="14"  y2="2"  stroke-width="1.3"/>
    <line x1="8"  y1="6"  x2="12"  y2="9"  stroke-width="1.3"/>

    <!-- Wing case: white interior, dark outline -->
    <circle cx="0" cy="0" r="10" fill="white" stroke-width="1.5"/>

    <!-- Center wing-divide stripe: solid dark, drawn on top of body -->
    <rect x="-0.9" y="-10" width="1.8" height="20" fill="currentColor" stroke="none"/>

    <!-- 4 spots: solid dark, drawn on top of body -->
    <circle cx="-3.5" cy="-3.5" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="3.5"  cy="-3.5" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="-3.5" cy="3.5"  r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="3.5"  cy="3.5"  r="2.2" fill="currentColor" stroke="none"/>

    <!-- Head: white interior, dark outline, sits on top of body -->
    <ellipse cx="0" cy="-10" rx="4" ry="2.5" fill="white" stroke-width="1.2"/>

    <!-- Antennae drawn last so they're visible over the head -->
    <line x1="-2" y1="-12" x2="-3.5" y2="-16" stroke-width="1.3"/>
    <line x1="2"  y1="-12" x2="3.5"  y2="-16" stroke-width="1.3"/>
  </g>
</svg>
